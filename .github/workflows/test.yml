name: NEXUS-OS Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Fast smoke tests — runs first, gives quick feedback ──────────────────────
  smoke:
    name: Smoke (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install NEXUS deps + build
      - name: Install NEXUS deps
        run: npm ci

      - name: Build NEXUS (src → dist)
        run: node scripts/build.js

      # Install Playwright in tests/
      - name: Install Playwright deps
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install chromium --with-deps

      # Serve dist/ and run smoke tests against it
      - name: Serve dist/ in background
        run: npx serve dist -p 3000 &
        
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 15000

      - name: Run smoke tests
        working-directory: tests
        env:
          CI: true
          BASE_URL: http://localhost:3000
        run: npm run test:smoke

  # ── Full test suite ───────────────────────────────────────────────────────────
  full:
    name: Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke  # Only run if smoke passes

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NEXUS deps
        run: npm ci

      - name: Build NEXUS (src → dist)
        run: node scripts/build.js

      - name: Install Playwright deps
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Serve dist/ in background
        run: npx serve dist -p 3000 &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 15000

      - name: Run all Playwright tests
        working-directory: tests
        env:
          CI: true
          BASE_URL: http://localhost:3000
        run: npm run test:ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/test-results/
          retention-days: 7
